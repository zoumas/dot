$font = Monospace

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/Pictures/wallpaper
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    rounding = 12

    inner_color = rgba(40, 40, 40, 0.6)
    outer_color = rgba(212, 190, 152, 0.9)
    check_color = rgba(169, 182, 101, 0.9)
    fail_color = rgba(234, 105, 98, 0.9)
    font_color = rgb(212, 190, 152)

    font_family = $font
    placeholder_text = Password...
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(212, 190, 152)

    position = -30, 0
    halign = right
    valign = top
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    color = rgb(212, 190, 152)

    position = -30, -150
    halign = right
    valign = top
}

# Keyboard layout, matches kb_layout = "us,gr"; click to switch
label {
    monitor =
    text = $LAYOUT[EN,GR]
    font_size = 14
    font_family = $font
    color = rgb(212, 190, 152)
    onclick = hyprctl switchxkblayout all next

    position = 170, -20
    halign = center
    valign = center
}
